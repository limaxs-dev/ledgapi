<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256" height="256"
     role="img" aria-label="ledgapi">
  <title>ledgapi</title>

  <!-- Brand-block tile -->
  <rect width="256" height="256" rx="28" ry="28" fill="#d4ff3a"/>

  <!-- Book: two open pages + spine -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- Left page (outer corners rounded via stroke-linejoin) -->
    <path d="M 76 92 L 124 88 L 124 168 L 76 164 Z"/>
    <!-- Right page -->
    <path d="M 132 88 L 180 92 L 180 164 L 132 168 Z"/>
    <!-- Spine: split into two segments above and below the API text,
         so the spine line never cuts through the letters -->
    <line x1="128" y1="94" x2="128" y2="118"/>
    <line x1="128" y1="150" x2="128" y2="162"/>
  </g>

  <!-- API text, centred on the spine -->
  <text x="128" y="134"
        font-family="Inter, 'SF Pro Text', system-ui, -apple-system, sans-serif"
        font-size="20"
        font-weight="500"
        letter-spacing="-0.4"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#1a1a1a">API</text>
</svg>
