services:
  ledgapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: limaxs/ledgapi:0.1.0
    container_name: ledgapi
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ledgapi-data:/data
    environment:
      APP__DATABASE__PATH: /data/ledgapi.db
      APP__EMBED__CACHE_DIR: /data/.cache/fastembed
      APP__LOG__FORMAT: json
      APP__AUTH__INITIAL_ADMIN_USERNAME: ${INITIAL_USERNAME:-admin}
      APP__AUTH__INITIAL_ADMIN_PASSWORD: ${INITIAL_PASSWORD:?set INITIAL_PASSWORD}
      APP__AUTH__ISSUER: ${APP_ISSUER:-http://localhost:8080}
      APP__AUTH__COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}

volumes:
  ledgapi-data:
