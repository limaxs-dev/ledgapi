<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorize · ledgapi</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main class="container auth-page" id="main">
        <section class="card login-card">
            <div class="login-brand">
                <img src="/static/logo.png" alt="ledgapi" class="login-logo">
            </div>
            <h1>Authorize access</h1>
            <p><strong>{{ client_name }}</strong> is requesting access to your registry as <strong>{{ username }}</strong>.</p>
            <dl class="scope-list">
                <dt>Requested scopes</dt>
                <dd><code>{{ scope }}</code></dd>
            </dl>
            <form method="post" action="/oauth/consent" class="consent-actions">
                <input type="hidden" name="client_id" value="{{ client_id }}">
                <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
                <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
                <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
                <input type="hidden" name="scope" value="{{ scope }}">
                <input type="hidden" name="state" value="{{ state }}">
                <input type="hidden" name="csrf" value="{{ csrf }}">
                <button name="decision" value="approve" type="submit">Allow</button>
                <button name="decision" value="deny" type="submit" class="btn-deny">Deny</button>
            </form>
        </section>
    </main>
</body>
</html>
