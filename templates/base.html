<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ledgapi{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="/">
            <img src="/static/logo.png" alt="ledgapi" class="brand-logo">
            <span class="brand-name">ledgapi</span>
        </a>
        <nav>
            <a href="/">Projects</a>
            <a href="/docs">Docs</a>
        </nav>
        <form class="logout-form" method="post" action="/logout" data-logout>
            <input type="hidden" name="csrf" value="">
            <button type="submit" class="logout-btn" title="Sign out">Sign out</button>
        </form>
        <script>
          // Read the CSRF cookie and inject it into every logout form.
          // The cookie is HttpOnly=false so document.cookie can read it,
          // and we just submit the form to /logout. Anonymous visitors
          // don't see a CSRF cookie so the form's value stays empty,
          // but the logout endpoint will just redirect them to /login.
          (function() {
            const m = document.cookie.match(/(?:^|; )ledgapi_csrf=([^;]+)/);
            if (m) {
              document.querySelectorAll('form[data-logout]').forEach(f => {
                f.querySelector('input[name="csrf"]').value = decodeURIComponent(m[1]);
              });
            }
          })();
        </script>
    </header>
    <main class="container" id="main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <small>API contracts, remembered by your agents.</small>
    </footer>
</body>
</html>
