<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ledgapi{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">
            <img src="/static/logo.svg" alt="ledgapi" class="brand-logo">
            <span class="brand-name">ledgapi</span>
        </a>
        <nav>
            <a href="/">Projects</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <small>API contracts, remembered by your agents.</small>
    </footer>
</body>
</html>
