[graph]
all-features = false

[advisories]
version = 2
# paste 1.0.15 is flagged as unmaintained (RUSTSEC-2024-0436). It is pulled
# in by fastembed -> tokenizers; both are upstream dependencies that we do
# not control. The crate is functionally correct, there is no known
# security vulnerability, and the maintained successor (`pastey`) cannot
# be substituted in place via `[patch.crates-io]` because tokenizers pins
# `paste` by name. Re-evaluate on every fastembed bump: the chain
# fastembed v6 -> tokenizers v0.22 -> paste is the trigger.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
